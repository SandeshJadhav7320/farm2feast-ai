
spring.application.name=fashion-ai

# Server port: Render provides PORT automatically
server.port=${PORT:8080}

# MySQL database - credentials supplied by Render
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and chat memory
spring.jpa.hibernate.ddl-auto=update
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# OpenRouter
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.model=openrouter/free

# JWT - must match the signing secret used by your store backend
jwt.secret=${JWT_SECRET}

# Error handling
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never


# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

